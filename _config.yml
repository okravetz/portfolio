baseurl: ""

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      cs_path: "./casestudies/"
      cs_img_path: "../assets/images/wf/"

sass:
  style: compressed
  sass_dir: _sass

permalink: /:path/:title
exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - assets/incoming
  - 1991
  - 1992
  - archive
  - design
  - scripts
