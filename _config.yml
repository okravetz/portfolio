baseurl: ""

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      cs_path: "./casestudies/"
      cs_img_path: "../assets/images/wf/"

sass:
  style: compressed
  sass_dir: _sass

permalink: /:path/:title

# /1992/ redirects to /1991/ (redirect_from in eras/1991.html).
plugins:
  - jekyll-redirect-from

exclude:
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - assets/incoming
  - 1991
  - 1992
  - archive
  - design
  - docs
  - scripts
