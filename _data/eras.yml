# The nine eras, oldest to newest. The time-travel bar, the mobile picker and the asset script read this file.
# `name` is the short name shown in the picker. 1969 and 1983 are from the build plan; the others are
# from the picker on the design board and are waiting for Oren's OK.
# `ui` is text that is only part of that era's chrome. `badges` are listed top to bottom as they appear in
# `badge_source`; the alt text is the badge's label. scripts/era-assets.py reads both when it draws images.
# `url` is the era's homepage. Today ("/") is the default era.
# `photos` sets how the headshot and case-study images look in that era: their pixel sizes (`headshot`,
# `thumbnail`), color depth (`colors`: websafe = the 216-color palette of 256-color displays, dithered;
# thousands = 16-bit color; full) and file format. scripts/era-assets.py draws them; an era without sizes
# gets none yet.
# `ready: true` marks eras whose page exists. The time-travel bar links only to ready eras and shows the
# others as plain labels, so nothing on the live site points at a page that isn't built yet.
- order: 1
  slug: "1969"
  label: "1969"
  name: Teletype printout
  url: /1969/
  ready: true
  # Terminal chrome from the design board, approved in the build plan.
  ui:
    aria_label: Oren Kravetz, as a 1969 teletype printout
    login: "@LOGIN OREN"
    connected: CONNECTED. ONE MOMENT.
    contents: "CONTENTS:"
    type: "@TYPE"
    logout: "@LOGOUT"
- order: 2
  slug: "1983"
  label: "1983"
  name: Bulletin board
  url: /1983/
  ready: true
  ui:
    aria_label: Oren Kravetz, as a 1983 bulletin board system
    connect: CONNECT 1200
    menu: MAIN MENU
    prompt: COMMAND?
- order: 3
  slug: "1991"
  label: "1991"
  name: The first web page
  url: /1991/
  ready: true
- order: 4
  slug: "1996"
  label: "1996"
  name: GeoCities on Netscape
  url: /1996/
  ready: true
  ui:
    counter_alt: Visitor counter
    more_work_columns: [Client, Years, What I did]
  photos:
    headshot: [128, 128]
    thumbnail: [120, 90]
    colors: websafe
    format: gif
  badge_source: assets/incoming/the-netscape-now-and-microsoft-internet-explorer-buttons-v0-bo5t2umgfxn51.webp
  badges:
    - id: netscape
      alt: Netscape Now! 3.0
    - id: ie
      alt: Microsoft Internet Explorer, free
- order: 5
  slug: "2001"
  label: "2001"
  name: The Flash era
  url: /2001/
  ui:
    loading: Loading
    skip: Skip intro >>
    replay: Replay intro
  photos:
    colors: thousands
    format: jpg
    quality: 40
- order: 6
  slug: "2006"
  label: "2006"
  name: Web 2.0
  url: /2006/
  ui:
    beta: beta
  photos:
    colors: full
    format: jpg
    quality: 75
- order: 7
  slug: "2013"
  label: "2013"
  name: Responsive and flat
  url: /2013/
- order: 8
  slug: today
  label: Today
  name: Current site
  url: /
  default: true
  ready: true
- order: 9
  slug: future
  label: Future
  name: Scripted agent
  url: /future/
