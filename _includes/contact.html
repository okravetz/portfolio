<section id="contact" class="section section--contact" aria-labelledby="contact-h">
  <div class="container">
    <p class="eyebrow">Contact</p>
    <h2 id="contact-h" class="section-title">Get in touch</h2>
    <ul class="contact">
      {%- for item in site.data.contact -%}
      <li><span class="contact__label">{{ item.label }}:</span> {% if item.href %}<a href="{{ item.href }}">{{ item.text }}</a>{% else %}{{ item.text }}{% endif %}</li>
      {%- endfor -%}
    </ul>
  </div>
</section>
