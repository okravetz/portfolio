<a href="#main" class="skip">Skip to main content</a>
{%- if page.url == "/" -%}
<img id="headshot" src="{{ site.baseurl }}{%- link assets/images/headshot.jpg -%}" alt="Headshot of Oren Kravetz" width="128" height="128" />
{%- endif -%}
<a href="{% link index.html %}" class="site-name"{% if page.url == "/" %} aria-current="page"{% endif %} aria-label="Oren Kravetz, home">
  {%- if page.overview -%}<span class="site-name__text">Oren Kravetz</span>{%- else -%}<h1>Oren Kravetz</h1>{%- endif -%}
</a>
<p class="eyebrow">UX designer &amp; manager · he/him/his</p>
<nav aria-label="Main Navigation">
  <ul>
    {%- for item in site.data.navigation -%}
    <li><a href="{% link index.html %}#{{ item.name | downcase | slugify: "latin" }}"{% if page.overview and item.name == "Work" %} aria-current="page"{% endif %}>{{ item.name }}</a></li>
    {%- endfor -%}
    <li>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </li>
  </ul>
</nav>
