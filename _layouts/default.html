<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>{{ page.title }}</title>
    <meta name="author" content="Oren Kravetz" />
    <meta
      name="description"
      content="Oren Kravetz's bio, résumé, portfolio, and contact information."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ site.baseurl }}{%- link assets/images/headshot.jpg -%}" />
    <meta
      property="og:description"
      content="Oren Kravetz's bio, résumé, portfolio, and contact information."
    />
    <meta
      property="og:title"
      content="Oren Kravetz's Portfolio"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Oren Kravetz's Portfolio"
    />
    <meta
      name="twitter:description"
      content="Oren Kravetz's bio, résumé, portfolio, and contact information."
    />
    <meta name="twitter:image" content="{{ site.baseurl }}{%- link assets/images/headshot.jpg -%}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="{{ "/assets/images/favicon.ico" | relative_url }}" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&family=DM+Serif+Text&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/styles.css" | relative_url }}">
    {%- include theme-init.html -%}

    <!-- the below three lines are a fix to get HTML5 semantic elements working in old versions of Internet Explorer-->
    <!--[if lt IE 9]>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.js"></script>
    <![endif]-->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-167RBEBRWP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-167RBEBRWP');
    </script>
  </head>
  <body>
    <header class="site-header dots">{%- include navigation.html -%}</header>
    <main id="main" class="{% if page.url == "/" %}home{% else %}page{% endif %}">{{ content }}</main>
    <footer class="site-footer dots-up">{%- include footer.html -%}</footer>
    <script src="{{ "/assets/js/theme.js" | relative_url }}" defer></script>
    <script src="{{ "/assets/js/year.js" | relative_url }}" defer></script>
  </body>
</html>
