<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <title>{{ page.title }}</title>
    <meta name="author" content="Oren Kravetz" />
    <meta
      name="description"
      content="Oren Kravetz's bio, résumé, portfolio, and contact information."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ site.baseurl }}{%- link assets/images/headshot.jpg -%}" />
    <meta
      property="og:description"
      content="Oren Kravetz's bio, résumé, portfolio, and contact information."
    />
    <meta
      property="og:title"
      content="Oren Kravetz's Portfolio"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Oren Kravetz's Portfolio"
    />
    <meta
      name="twitter:description"
      content="Oren Kravetz's bio, résumé, portfolio, and contact information."
    />
    <meta name="twitter:image" content="{{ site.baseurl }}{%- link assets/images/headshot.jpg -%}" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="{{ "/assets/images/favicon.ico" | relative_url }}" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Serif+Display&family=DM+Serif+Text&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/styles.css" | relative_url }}?v={{ site.time | date: "%s" }}">
    {%- include theme-init.html -%}
    <script>
      document.documentElement.className += " js";
      {%- if page.url == "/" %}
      // Today's time-travel bar stays open if the visitor opened it or used it to leave, until they close it.
      try { if (sessionStorage.getItem("tt-open") === "1") document.documentElement.className += " tt-keep"; } catch (e) {}
      {%- endif %}
    </script>

    <!-- the below three lines are a fix to get HTML5 semantic elements working in old versions of Internet Explorer-->
    <!--[if lt IE 9]>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.js"></script>
    <![endif]-->

    <script type="application/ld+json">
{% include jsonld.html %}
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-167RBEBRWP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-167RBEBRWP');
    </script>
  </head>
  <body>
    <header class="site-header dots">{%- include navigation.html -%}</header>
    <main id="main" tabindex="-1" class="{% if page.url == "/" %}home{% else %}page{% endif %}">{{ content }}</main>
    <footer class="site-footer dots-up">{%- include footer.html -%}</footer>
    {%- if page.url == "/" -%}
    <button type="button" class="tt-open" aria-expanded="false" aria-controls="time-travel">{{ site.data.site.labels.time_travel.title }}<svg aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
    {%- include time-travel.html current="today" closable=true -%}
    <script src="{{ "/assets/js/time-travel.js" | relative_url }}?v={{ site.time | date: "%s" }}" defer></script>
    {%- endif %}
    <script src="{{ "/assets/js/theme.js" | relative_url }}?v={{ site.time | date: "%s" }}" defer></script>
    <script src="{{ "/assets/js/year.js" | relative_url }}?v={{ site.time | date: "%s" }}" defer></script>
  </body>
</html>
